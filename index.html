<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo List &bull; Stay On Track</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./Icons/webIcon.png" type="img/png">
</head>
<body>
    <div class="confirmation">
        <div class="styling">
            <p class="p-confirm">Are you sure you want to delete it?</p>
            <div class="btns">
                <button class="confirmBtn yes" name="confirmDelete">Yes</button>
                <button class="confirmBtn no" name="abortDelete">No</button>
            </div>
        </div>
    </div>
    <div class="nightDarkmode">
        <img src="./Icons/lightMode.png" alt="light-mode" class="modeSwitch">
    </div>
    <div class="divHeading">
        <div class="sub-div-1">
            <p class="to">To</p>
            <p class="dot">&bull;</p>
            <p class="do">Do</p>
        </div>
        <div class="line">
            <p class="p-1">STAY ON TRACK, GET THINGS DONE</p>
        </div>
    </div>
    <div class="count">
        <div>
            <p class="totalCount">0</p>
            <p class="total">Total</p>
        </div>
        <div>
            <p class="pendingCount">0</p>
            <p class="pending">Pending</p>
        </div>
        <div>
            <p class="doneCount">0</p>
            <p class="done">Done</p>
        </div>
    </div>
    <div class="center">
<div class="insertBar">
        <input type="date" class="date" label="date">
        <input class="insert" placeholder="Insert Goal..." label="input">
        <div class="prioDiv">
            <input type="checkbox" class="prioCheck" label="checkBox">
            <psan class="priority">Priority</psan>
        </div>
        <button class="proceed">
            <img src="./Icons/chevron-right-color.png" alt="rightChevron" class="right-chevron">
        </button>
    </div>
    <div class="divList">
        <div class="list">
            <!---->
            <!-- <div class="todoTask">
                <div class="todoArea">
                    <input type="checkbox" class="checkbox">
                    <div class="pad">
                        <p class="goal">Lorem ipsum dolor sit amet consectetur adipisicing elit. Recusandae, sunt.</p>
                    </div>
                </div>
                <div class="flexEnd">
                    <p class="dateAdd">2026-06-24</p>
                    <button class="cross">x</button>
                </div>
            </div> -->
            <!---->
        </div>
    </div>
    </div>
</body>
<script src="code.js">
</script>
</html>
