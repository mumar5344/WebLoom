<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do List</title>
    <link rel="stylesheet" href="1.css">
</head>
<body>
    <div class="divHeading">
        <div class="sub-div-1">
            <p class="to">To</p>
            <p class="dot">&bull;</p>
            <p class="do">Do</p>
        </div>
        <div class="line">
            <p class="p-1">STAY ON TRACK, GET THINGS DONE</p>
        </div>
    </div>
    <div class="count">
        <div>
            <p class="totalCount">0</p>
            <p class="total">Total</p>
        </div>
        <div>
            <p class="pendingCount">0</p>
            <p class="pending">Pending</p>
        </div>
        <div>
            <p class="doneCount">0</p>
            <p class="done">Done</p>
        </div>
    </div>
    <div class="insertBar">
        <input class="insert" placeholder="Insert Goal..." >
        <button class="proceed">
            <img src="./Icons/chevron-right-color.png" class="right-chevron">
        </button>
    </div>
    <div class="divList">
        <div class="list">
            <!---->
            <div class="todoTask">
                <div class="todoArea">
                    <input type="checkbox" class="checkbox">
                    <p class="goal">dsadas</p>
                </div>
                <button class="cross">x</button>
            </div>
            <!---->
        </div>
    </div>
</body>
<script src="1.js"></script>
</html>
